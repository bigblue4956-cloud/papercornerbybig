<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทำกระดาษสามเหลี่ยมเย็บมุมเอกสาร by หมวดเหมสัสดี</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <!-- cdnjs for libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary: #1e293b;
      --accent: #2563eb;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background-color: var(--bg-color); color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Header */
    header { background: var(--primary); color: white; padding: 1rem 2rem; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    header h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: 0.5px; }
    header p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

    /* Main Layout */
    .container { display: flex; flex: 1; padding: 20px; gap: 20px; max-width: 1600px; margin: 0 auto; width: 100%; }
    
    /* Sidebar Controls */
    .controls { width: 360px; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; }
    .section-title { font-size: 1rem; font-weight: 600; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 5px; margin-bottom: 5px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: #475569; }
    .form-group input, .form-group select, .form-group textarea { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--primary); }
    .btn-outline:hover { background: #f1f5f9; }

    /* Preview Area */
    .preview-area { flex: 1; background: #e2e8f0; border-radius: 12px; padding: 20px; display: flex; justify-content: center; align-items: flex-start; overflow-auto; }
    
    /* A4 Sheet Dimensions in mm convert to pixels for screen (at 96 DPI approx) */
    .a4-page {
      width: 210mm;
      min-height: 297mm;
      background: white;
      padding: 10mm 8mm;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: repeat(4, 65mm);
      grid-template-rows: repeat(6, 65mm);
      gap: 2mm;
      justify-content: center;
      align-content: center;
      margin: 0 auto;
    }

    /* 6.5 x 6.5 cm Box */
    .corner-item {
      width: 65mm;
      height: 65mm;
      border: 1px dashed #cbd5e1;
      position: relative;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      overflow: hidden;
      background: #fff;
    }

    /* Cut line guide */
    .corner-item::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 141%;
      height: 1px;
      border-top: 1px dotted #94a3b8;
      transform: rotate(45deg);
      transform-origin: top right;
      pointer-events: none;
    }

    .item-logo { height: 28px; object-fit: contain; margin-bottom: 2px; }
    .item-text { font-family: 'Sarabun', sans-serif; line-height: 1.2; word-break: break-word; white-space: pre-line; }

    @media print {
      body { background: white; }
      .controls, header { display: none; }
      .preview-area { padding: 0; background: white; }
      .a4-page { box-shadow: none; padding: 0; margin: 0; }
    }
  </style>
</head>
<body>

  <header>
    <h1>ทำกระดาษสามเหลี่ยมเย็บมุมเอกสาร</h1>
    <p>by หมวดเหมสัสดี | ออกแบบและพิมพ์ที่หุ้มมุมเอกสารขนาดมาตรฐาน A4</p>
  </header>

  <div class="container">
    <!-- Controls -->
    <div class="controls">
      <div class="section-title">1. ตราสัญลักษณ์</div>
      <div class="form-group">
        <label>อัปโหลดโลโก้หน่วยงาน</label>
        <input type="file" id="logoInput" accept="image/*">
      </div>
      <div class="form-group">
        <label>ขนาดโลโก้ (px)</label>
        <input type="range" id="logoSize" min="15" max="50" value="28">
      </div>

      <div class="section-title">2. ข้อความ & ฟอนต์</div>
      <div class="form-group">
        <label>ชื่อหน่วยงาน / ข้อความ</label>
        <textarea id="textInput" rows="3">โรงเรียนเมืองนครนายก&#10;สำนักงานเขตพื้นที่การศึกษามัธยมศึกษา&#10;ปราจีนบุรี นครนายก</textarea>
      </div>
      <div class="form-group">
        <label>ขนาดฟอนต์ (pt)</label>
        <input type="number" id="fontSize" value="9" min="6" max="16">
      </div>

      <div class="section-title">3. ดาวน์โหลด & สั่งพิมพ์</div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="downloadPDF()">ดาวน์โหลด PDF</button>
      </div>
      <div class="btn-group">
        <button class="btn btn-outline" onclick="window.print()">สั่งพิมพ์ทันที</button>
      </div>
    </div>

    <!-- Live Preview -->
    <div class="preview-area">
      <div class="a4-page" id="printTarget">
        <!-- 24 Items will be generated here -->
      </div>
    </div>
  </div>

  <script>
    const printTarget = document.getElementById('printTarget');
    const logoInput = document.getElementById('logoInput');
    const logoSize = document.getElementById('logoSize');
    const textInput = document.getElementById('textInput');
    const fontSize = document.getElementById('fontSize');

    let currentLogoSrc = '';

    // Render 24 items
    function renderItems() {
      printTarget.innerHTML = '';
      for (let i = 0; i < 24; i++) {
        const item = document.createElement('div');
        item.className = 'corner-item';
        
        const img = document.createElement('img');
        img.className = 'item-logo';
        img.style.height = `${logoSize.value}px`;
        if (currentLogoSrc) img.src = currentLogoSrc;
        else img.style.display = 'none';

        const text = document.createElement('div');
        text.className = 'item-text';
        text.style.fontSize = `${fontSize.value}pt`;
        text.innerText = textInput.value;

        item.appendChild(img);
        item.appendChild(text);
        printTarget.appendChild(item);
      }
    }

    // Event Listeners
    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          currentLogoSrc = evt.target.result;
          renderItems();
        };
        reader.readAsDataURL(file);
      }
    });

    logoSize.addEventListener('input', renderItems);
    textInput.addEventListener('input', renderItems);
    fontSize.addEventListener('input', renderItems);

    // Initial Render
    renderItems();

    // Export PDF
    function downloadPDF() {
      const element = document.getElementById('printTarget');
      const opt = {
        margin:       0,
        filename:     'กระดาษสามเหลี่ยมเย็บมุม_หมวดเหมสัสดี.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
